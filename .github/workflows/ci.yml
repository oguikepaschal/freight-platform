name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run before `actions/setup-node`: its `cache: pnpm` resolves the
      # pnpm store path by shelling out to `pnpm`, which doesn't exist on
      # PATH yet at that point otherwise. The runner's preinstalled system
      # Node already has corepack, so this doesn't need setup-node's own
      # Node version to be active first — the pnpm shim it creates stays on
      # PATH after setup-node switches the active Node version.
      - name: Enable Corepack
        run: corepack enable

      # Node 22, not the 20 floor package.json's engines.node states: on
      # Node 20.20.2 (the latest 20.x), `pnpm --filter @freight/ui test`
      # fails with "node: bad option: --experimental-strip-types" — that
      # flag doesn't exist before Node 22.6. engines.node's ">=20" doesn't
      # actually hold for this test script; flagging that here rather than
      # silently rewriting engines.node or the test script, which are
      # outside a CI workflow's scope.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test — packages/ui
        run: pnpm --filter @freight/ui test

      - name: Test — apps/web locale prerender
        run: pnpm --filter @freight/web test:locale

  # Runs the @freight/database suite against a throwaway Neon branch. The
  # driver stack (drizzle neon-http, @neondatabase/serverless) doesn't speak
  # the plain Postgres protocol, so a Postgres service container won't work.
  # The parent is `dev`, never `main` (production), so CI can't touch either.
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run before `actions/setup-node`: its `cache: pnpm` resolves the
      # pnpm store path by shelling out to `pnpm`, which doesn't exist on
      # PATH yet at that point otherwise. The runner's preinstalled system
      # Node already has corepack, so this doesn't need setup-node's own
      # Node version to be active first — the pnpm shim it creates stays on
      # PATH after setup-node switches the active Node version.
      - name: Enable Corepack
        run: corepack enable

      # Node 22, not the 20 floor package.json's engines.node states: on
      # Node 20.20.2 (the latest 20.x), `pnpm --filter @freight/ui test`
      # fails with "node: bad option: --experimental-strip-types" — that
      # flag doesn't exist before Node 22.6. engines.node's ">=20" doesn't
      # actually hold for this test script; flagging that here rather than
      # silently rewriting engines.node or the test script, which are
      # outside a CI workflow's scope.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # expires_at is a backstop: Neon deletes the branch itself in 2 hours
      # if the delete step below never runs (e.g. the runner is lost).
      - name: Compute branch expiry
        run: echo "BRANCH_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      # TEMP DIAGNOSTIC (remove): names/ids only, no connection strings.
      - name: Debug list branches
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $NEON_API_KEY" "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message') or [(b['name'],b.get('default'),b.get('protected')) for b in d['branches']])"

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: dev
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.BRANCH_EXPIRES_AT }}

      # Belt and braces: mask both connection strings before any later step
      # can print them. Passed via env so they never appear in a command line.
      - name: Mask connection strings
        env:
          DB_URL: ${{ steps.neon.outputs.db_url }}
          DB_URL_POOLED: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$DB_URL_POOLED"

      # Applies any migration in this PR on top of dev's current state.
      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @freight/database db:migrate

      - name: Test — packages/database
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @freight/database test

      # Runs after failures and cancellations too. Skipped only if the
      # create step never produced a branch (nothing to delete).
      - name: Delete Neon branch
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
